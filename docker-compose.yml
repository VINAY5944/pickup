
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pickup_counter
      POSTGRES_USER: pickup
      POSTGRES_PASSWORD: pickup_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickup -d pickup_counter"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pickup_counter
      DB_USER: pickup
      DB_PASSWORD: pickup_dev_password
    command: >
      sh -c "npx sequelize-cli db:migrate --env production &&
             npx sequelize-cli db:seed:all --env production"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pickup_counter
      DB_USER: pickup
      DB_PASSWORD: pickup_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_WEBHOOK_SECRET: local_assignment_webhook_secret_change_me
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  expiry-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["npm", "run", "worker:expiry"]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pickup_counter
      DB_USER: pickup
      DB_PASSWORD: pickup_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_WEBHOOK_SECRET: local_assignment_webhook_secret_change_me
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/myapp
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
